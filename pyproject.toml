[project]
name = "nigraanos-backend"
version = "0.1.0"
description = "NigraanOS — AI-powered civic intelligence platform backend"
requires-python = ">=3.13"

[project.scripts]
nigraanos-api = "app.main:run"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
